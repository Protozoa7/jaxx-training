<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="description" content="Jaxx's four-day training split and local workout log." />
  <title>Jaxx Training</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="kicker">4 DAY TRAINING SPLIT</p>
        <h1>JAXX TRAINING</h1>
        <p class="intro">Simple. Repeatable. Track each session and beat the last one.</p>
      </div>
    </header>

    <nav class="day-nav" aria-label="Choose workout day">
      <button class="day-button active" data-day="deadlift">
        <span class="day-number">01</span>
        <span>DEADLIFT</span>
      </button>
      <button class="day-button" data-day="upper">
        <span class="day-number">02</span>
        <span>UPPER</span>
      </button>
      <button class="day-button" data-day="lower">
        <span class="day-number">03</span>
        <span>LOWER</span>
      </button>
      <button class="day-button" data-day="combo">
        <span class="day-number">04</span>
        <span>COMBO</span>
      </button>
    </nav>

    <section id="workout" class="workout" aria-live="polite"></section>

    <footer>
      <p>Training history is saved locally on this device.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
